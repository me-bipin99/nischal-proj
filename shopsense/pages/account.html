<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | My Account</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-area">
        <div class="page-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
          <div>
            <h1 class="page-title">My Profile & Account</h1>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/index.html">ShopSense</a></li>
                <li class="breadcrumb-item active" aria-current="page">Account</li>
              </ol>
            </nav>
          </div>
        </div>

        <div class="row g-4">
          <!-- Profile Information Form -->
          <div class="col-12 col-lg-7">
            <form id="account-profile-form" class="card p-4">
              <h5 class="fw-bold mb-4 border-bottom pb-2">Personal Information</h5>

              <!-- Avatar Upload UI -->
              <div class="d-flex align-items-center gap-4 mb-4">
                <img id="avatar-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Avatar Preview" class="rounded-circle shadow border" width="90" height="90" style="object-fit: cover;">
                <div>
                  <label for="avatar-file-input" class="btn btn-sm btn-outline-primary mb-2">
                    <i class="bi bi-camera me-1"></i> Upload New Photo
                  </label>
                  <input type="file" id="avatar-file-input" class="d-none" accept="image/*">
                  <div class="text-muted small">Allowed JPG, GIF or PNG. Max size 1MB</div>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <label for="acc-fullname" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="acc-fullname" required>
                </div>

                <div class="col-12 col-md-6">
                  <label for="acc-email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                  <input type="email" class="form-control" id="acc-email" required>
                </div>

                <div class="col-12 col-md-6">
                  <label for="acc-phone" class="form-label fw-semibold">Phone Number</label>
                  <input type="text" class="form-control" id="acc-phone">
                </div>

                <div class="col-12 col-md-6">
                  <label for="acc-role" class="form-label fw-semibold">User Role</label>
                  <input type="text" class="form-control bg-light" id="acc-role" readonly>
                </div>

                <div class="col-12">
                  <label for="acc-shop" class="form-label fw-semibold">Assigned Shop Name</label>
                  <input type="text" class="form-control" id="acc-shop">
                </div>
              </div>

              <div class="d-flex justify-content-end pt-3 border-top">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-check-lg me-1"></i> Save Profile Details
                </button>
              </div>
            </form>
          </div>

          <!-- Change Password Form -->
          <div class="col-12 col-lg-5">
            <form id="account-password-form" class="card p-4">
              <h5 class="fw-bold mb-4 border-bottom pb-2">Change Password</h5>

              <div class="mb-3">
                <label for="pwd-current" class="form-label fw-semibold">Current Password</label>
                <input type="password" class="form-control" id="pwd-current" placeholder="••••••••" required>
              </div>

              <div class="mb-3">
                <label for="pwd-new" class="form-label fw-semibold">New Password</label>
                <input type="password" class="form-control" id="pwd-new" placeholder="At least 6 characters" required>
              </div>

              <div class="mb-4">
                <label for="pwd-confirm" class="form-label fw-semibold">Confirm New Password</label>
                <input type="password" class="form-control" id="pwd-confirm" placeholder="Repeat new password" required>
              </div>

              <div class="d-flex justify-content-end pt-3 border-top">
                <button type="submit" class="btn btn-outline-primary">
                  <i class="bi bi-key me-1"></i> Update Password
                </button>
              </div>
            </form>
          </div>
        </div>

      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/account.js"></script>
</body>
</html>
