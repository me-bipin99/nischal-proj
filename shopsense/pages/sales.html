<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | Sales Transactions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/sales.css">
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-area sales-content-area">

        <!-- Page Header -->
        <div class="page-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
          <div>
            <h1 class="page-title">Sales Transactions</h1>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/index.html">ShopSense</a></li>
                <li class="breadcrumb-item active" aria-current="page">Sales</li>
              </ol>
            </nav>
          </div>
        </div>

        <!-- Two-panel layout: sticky form left, scrollable table right -->
        <div class="sales-layout">

          <!-- ── LEFT: Sticky Record Sale Panel ─────────────────────────── -->
          <div class="sales-form-panel">
            <div class="card p-3 p-md-4 sales-form-card">

              <div class="d-flex align-items-center gap-2 mb-3">
                <div class="p-2 rounded-3 bg-primary-subtle text-primary">
                  <i class="bi bi-cart-plus fs-5"></i>
                </div>
                <h5 class="fw-bold mb-0 text-dark">Record New Sale</h5>
              </div>

              <!-- ── Product Search + Dropdown ─────────────────────────── -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Search & Add Product <span class="text-danger">*</span></label>

                <div class="product-search-wrapper" id="product-search-wrapper">
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 pe-1">
                      <i class="bi bi-search text-muted"></i>
                    </span>
                    <input
                      type="text"
                      class="form-control border-start-0 ps-1"
                      id="product-search-input"
                      placeholder="Type product name or SKU…"
                      autocomplete="off"
                    >
                  </div>
                  <!-- Fuzzy-match dropdown -->
                  <div class="product-search-dropdown" id="product-search-dropdown" style="display:none;"></div>
                </div>
              </div>

              <!-- ── Customer & Payment ────────────────────────────────── -->
              <div class="mb-3">
                <label for="sale-customer" class="form-label fw-semibold">Customer Name</label>
                <input type="text" class="form-control" id="sale-customer" placeholder="Walk-in Customer">
              </div>

              <div class="mb-3">
                <label for="sale-payment" class="form-label fw-semibold">Payment Method</label>
                <select class="form-select" id="sale-payment">
                  <option value="Cash">Cash</option>
                  <option value="Credit Card">Credit Card</option>
                  <option value="Debit Card">Debit Card</option>
                  <option value="Apple Pay">Apple Pay</option>
                  <option value="Google Pay">Google Pay</option>
                </select>
              </div>

              <!-- ── Running Total ──────────────────────────────────────── -->
              <div class="cart-total-box d-flex align-items-center justify-content-between mb-3" id="cart-total-box">
                <span class="fw-semibold text-muted">Total Payable:</span>
                <span class="fs-4 fw-bold text-primary" id="sale-total-display" data-price-usd="0">
                  <!-- filled by JS -->
                </span>
              </div>

              <!-- ── Checkout ───────────────────────────────────────────── -->
              <button type="button" class="btn btn-primary w-100 py-2 fw-semibold" id="checkout-btn" disabled>
                <i class="bi bi-receipt me-1"></i> Checkout &amp; View Bill
              </button>

              <!-- ── Selected Items (shown below checkout button) ───────── -->
              <div class="cart-section mt-3" id="cart-section" style="display:none;">
                <div class="d-flex align-items-center justify-content-between mb-2">
                  <span class="fw-semibold text-dark small">
                    <i class="bi bi-cart3 me-1 text-primary"></i>Selected Items
                  </span>
                  <button type="button" class="btn btn-sm btn-light py-0 px-2 text-muted" id="cart-clear-btn">
                    <i class="bi bi-trash3 me-1"></i>Clear
                  </button>
                </div>
                <div id="cart-items-list"></div>
              </div>

            </div>
          </div><!-- /sales-form-panel -->

          <!-- ── RIGHT: Scrollable Sales History ───────────────────────── -->
          <div class="sales-table-panel">
            <div class="card p-3 p-md-4 sales-table-card">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="fw-bold text-dark mb-0">Sales Transaction History</h5>
                <span class="badge bg-light text-muted border">Real-Time Sync</span>
              </div>

              <div class="table-responsive sales-table-scroll">
                <table class="table table-custom align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Invoice</th>
                      <th>Product</th>
                      <th>Amount</th>
                      <th>Customer</th>
                      <th>Payment</th>
                      <th>Date</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="sales-table-body">
                    <!-- Rendered dynamically -->
                  </tbody>
                </table>
              </div>
            </div>
          </div><!-- /sales-table-panel -->

        </div><!-- /sales-layout -->

      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <!-- ── Bill Modal ──────────────────────────────────────────────────────── -->
  <div class="modal fade" id="bill-modal" tabindex="-1" aria-labelledby="bill-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width: 480px;">
      <div class="modal-content border-0 shadow-lg rounded-4">

        <div class="modal-header border-bottom pb-3">
          <div>
            <h5 class="modal-title fw-bold text-dark mb-0" id="bill-modal-label">
              <i class="bi bi-receipt-cutoff text-primary me-2"></i>Sale Receipt
            </h5>
            <p class="text-muted small mb-0" id="bill-invoice-meta"></p>
          </div>
        </div>

        <div class="modal-body px-4 py-3">
          <!-- Store & customer info -->
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <div class="fw-semibold text-dark" id="bill-store-name">ShopSense Store</div>
              <div class="text-muted small" id="bill-customer-name"></div>
            </div>
            <div class="text-end">
              <div class="text-muted small" id="bill-datetime"></div>
              <span class="badge bg-light text-dark border mt-1" id="bill-payment-method"></span>
            </div>
          </div>

          <hr class="my-2">

          <!-- Line items -->
          <div id="bill-items-list" class="mb-3"></div>

          <hr class="my-2">

          <!-- Total -->
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold text-dark fs-6">Total Paid</span>
            <span class="fw-bold text-primary fs-5" id="bill-total"></span>
          </div>
        </div>

        <div class="modal-footer border-top pt-3">
          <button type="button" class="btn btn-primary px-4 fw-semibold" id="bill-done-btn">
            <i class="bi bi-check2-circle me-1"></i> Done
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/sales.js"></script>
</body>
</html>
