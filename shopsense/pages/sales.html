<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | Sales Transactions</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-area">
        <div class="page-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
          <div>
            <h1 class="page-title">Sales Transactions</h1>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/index.html">ShopSense</a></li>
                <li class="breadcrumb-item active" aria-current="page">Sales</li>
              </ol>
            </nav>
          </div>
        </div>

        <div class="row g-4 mb-4">
          <!-- Record Sale Form Card -->
          <div class="col-12 col-lg-5 col-xl-4">
            <div class="card p-3 p-md-4 h-100">
              <div class="d-flex align-items-center gap-2 mb-3">
                <div class="p-2 rounded-3 bg-primary-subtle text-primary">
                  <i class="bi bi-cart-plus fs-5"></i>
                </div>
                <h5 class="fw-bold mb-0 text-dark">Record New Sale</h5>
              </div>

              <form id="record-sale-form">
                <div class="mb-3">
                  <label for="sale-product-select" class="form-label fw-semibold">Select Product <span class="text-danger">*</span></label>
                  <select class="form-select" id="sale-product-select" required>
                    <option value="">Loading products...</option>
                  </select>
                </div>

                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label for="sale-qty" class="form-label fw-semibold">Quantity <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="sale-qty" min="1" value="1" required>
                  </div>
                  <div class="col-6">
                    <label for="sale-unit-price" class="form-label fw-semibold">Unit Price ($)</label>
                    <input type="number" step="0.01" class="form-control bg-light" id="sale-unit-price" readonly placeholder="0.00">
                  </div>
                </div>

                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label for="sale-week" class="form-label fw-semibold">Week Period</label>
                    <select class="form-select" id="sale-week">
                      <option value="Week 30">Week 30 (Current)</option>
                      <option value="Week 29">Week 29</option>
                      <option value="Week 28">Week 28</option>
                      <option value="Week 27">Week 27</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label for="sale-payment" class="form-label fw-semibold">Payment Method</label>
                    <select class="form-select" id="sale-payment">
                      <option value="Credit Card">Credit Card</option>
                      <option value="Cash">Cash</option>
                      <option value="Apple Pay">Apple Pay</option>
                      <option value="Debit Card">Debit Card</option>
                      <option value="Google Pay">Google Pay</option>
                    </select>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="sale-customer" class="form-label fw-semibold">Customer Name</label>
                  <input type="text" class="form-control" id="sale-customer" placeholder="Walk-in Customer">
                </div>

                <!-- Total Summary Box -->
                <div class="p-3 bg-light rounded-3 d-flex align-items-center justify-content-between mb-3 border">
                  <span class="fw-semibold text-muted">Total Payable:</span>
                  <span class="fs-4 fw-bold text-primary" id="sale-total-display">$0.00</span>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                  <i class="bi bi-check2-circle me-1"></i> Submit & Print Receipt
                </button>
              </form>
            </div>
          </div>

          <!-- Sales Log Table -->
          <div class="col-12 col-lg-7 col-xl-8">
            <div class="card p-3 p-md-4 h-100">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="fw-bold text-dark mb-0">Sales Transaction History</h5>
                <span class="badge bg-light text-muted border">Real-Time Sync</span>
              </div>

              <div class="table-responsive">
                <table class="table table-custom align-middle">
                  <thead>
                    <tr>
                      <th>Invoice</th>
                      <th>Product</th>
                      <th>Amount</th>
                      <th>Customer</th>
                      <th>Payment</th>
                      <th>Week</th>
                      <th>Date</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="sales-table-body">
                    <!-- Rendered dynamically from sales.js -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/sales.js"></script>
</body>
</html>
