<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | Edit Product</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-area">
        <div class="page-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
          <div>
            <h1 class="page-title">Edit Product Details</h1>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/index.html">ShopSense</a></li>
                <li class="breadcrumb-item"><a href="/pages/products.html">Products</a></li>
                <li class="breadcrumb-item active" aria-current="page">Edit Product</li>
              </ol>
            </nav>
          </div>
          <div>
            <a href="/pages/products.html" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-1"></i> Back to Inventory
            </a>
          </div>
        </div>

        <form id="edit-product-form" class="card p-4">
          <div class="row g-4">
            <div class="col-12 col-md-4 text-center border-end-md">
              <label class="form-label fw-bold d-block mb-3">Product Image</label>
              <div class="mb-3">
                <img id="prod-img-preview" src="https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=300&q=80" alt="Product Image" class="rounded-4 border shadow-sm img-fluid" style="width: 200px; height: 200px; object-fit: cover;">
              </div>
              <input type="file" id="prod-image" class="form-control form-control-sm" accept="image/*">
            </div>

            <div class="col-12 col-md-8">
              <div class="row g-3">
                <div class="col-12 col-md-8">
                  <label for="prod-name" class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="prod-name" required>
                </div>

                <div class="col-12 col-md-4">
                  <label for="prod-sku" class="form-label fw-semibold">SKU Code <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="prod-sku" required>
                </div>

                <div class="col-12 col-md-6">
                  <label for="prod-category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                  <select class="form-select" id="prod-category" required>
                    <option value="Beverages">Beverages</option>
                    <option value="Electronics & Accessories">Electronics & Accessories</option>
                    <option value="Packaged Foods & Snacks">Packaged Foods & Snacks</option>
                    <option value="Personal Care & Cosmetics">Personal Care & Cosmetics</option>
                    <option value="Home & Cleaning">Home & Cleaning</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label for="prod-supplier" class="form-label fw-semibold">Supplier Name</label>
                  <input type="text" class="form-control" id="prod-supplier">
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                  <label for="prod-price" class="form-label fw-semibold">Selling Price ($) <span class="text-danger">*</span></label>
                  <input type="number" step="0.01" class="form-control" id="prod-price" required>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                  <label for="prod-cost" class="form-label fw-semibold">Cost Price ($)</label>
                  <input type="number" step="0.01" class="form-control" id="prod-cost">
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                  <label for="prod-stock" class="form-label fw-semibold">Current Stock <span class="text-danger">*</span></label>
                  <input type="number" class="form-control" id="prod-stock" required>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                  <label for="prod-unit" class="form-label fw-semibold">Unit Type</label>
                  <select class="form-select" id="prod-unit">
                    <option value="pcs">pcs</option>
                    <option value="bottle">bottle</option>
                    <option value="pack">pack</option>
                    <option value="box">box</option>
                    <option value="kg">kg</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label for="prod-reorder" class="form-label fw-semibold">Low Stock Reorder Threshold</label>
                  <input type="number" class="form-control" id="prod-reorder">
                </div>
              </div>

              <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a href="/pages/products.html" class="btn btn-light border">Cancel</a>
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-save me-1"></i> Save Changes
                </button>
              </div>
            </div>
          </div>
        </form>
      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/products.js"></script>
</body>
</html>
