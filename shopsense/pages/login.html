<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | Sign In</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="sidebar-brand-logo" style="width: 44px; height: 44px; font-size: 1.5rem;">
          <i class="bi bi-shop"></i>
        </div>
        <span class="fs-3 fw-bold text-dark tracking-tight">ShopSense</span>
      </div>

      <div class="text-center mb-4">
        <h4 class="fw-bold text-dark mb-1">Welcome Back!</h4>
        <p class="text-muted small">Sign in to access your retail inventory dashboard</p>
      </div>

      <form id="login-form">
        <div class="mb-3">
          <label for="login-email" class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
            <input type="text" class="form-control border-start-0 login-placeholder-input" id="login-email"
              data-placeholder="Enter your email" data-real-type="email" autocomplete="email" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="login-password" class="form-label fw-semibold mb-0">Password</label>
            <a href="/pages/forgot-password.html" class="text-primary text-decoration-none small">Forgot Password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
            <input type="text" class="form-control border-start-0 border-end-0 login-placeholder-input" id="login-password"
              data-placeholder="Enter your password" data-real-type="password" autocomplete="current-password" required>
            <button class="input-group-text bg-light text-muted border-start-0" type="button" id="toggle-password"
              tabindex="-1" title="Show/hide password" style="cursor:pointer;">
              <i class="bi bi-eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="remember-me" checked>
          <label class="form-check-label text-muted small" for="remember-me">
            Remember me on this browser
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 mb-3 fw-semibold fs-6">
          Sign In to Dashboard
        </button>

        <div class="text-center text-muted small">
          Don't have an account? <a href="/pages/signup.html" class="text-primary fw-semibold text-decoration-none">Create Account</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/auth.js"></script>

  <script>
    // ── Placeholder-style inputs ──────────────────────────────────────────────
    // Inputs start as type="text" showing placeholder text in muted style.
    // On focus/click the placeholder clears and the input switches to its real type.
    // On blur, if empty, placeholder is restored.
    document.querySelectorAll('.login-placeholder-input').forEach(function(input) {
      const placeholder = input.getAttribute('data-placeholder');
      const realType    = input.getAttribute('data-real-type');

      // Start in placeholder state
      input.value = placeholder;
      input.classList.add('login-input-placeholder');

      input.addEventListener('focus', function() {
        if (input.classList.contains('login-input-placeholder')) {
          input.value = '';
          input.classList.remove('login-input-placeholder');
          input.type = realType;
        }
      });

      input.addEventListener('blur', function() {
        if (input.value === '') {
          input.value = placeholder;
          input.classList.add('login-input-placeholder');
          input.type = 'text'; // show placeholder as readable text
        }
      });

      // Don't submit placeholder text as actual value
      input.form && input.form.addEventListener('submit', function() {
        if (input.classList.contains('login-input-placeholder')) {
          input.value = '';
        }
      }, { once: false });
    });

    // ── Password eye toggle ───────────────────────────────────────────────────
    const toggleBtn  = document.getElementById('toggle-password');
    const toggleIcon = document.getElementById('toggle-password-icon');
    const pwdInput   = document.getElementById('login-password');

    toggleBtn.addEventListener('click', function() {
      // Only act if the field is in real-password mode (not placeholder state)
      if (pwdInput.classList.contains('login-input-placeholder')) return;

      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      toggleIcon.classList.toggle('bi-eye',      !isPassword);
      toggleIcon.classList.toggle('bi-eye-slash', isPassword);
    });
  </script>
</body>
</html>
