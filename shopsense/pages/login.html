<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | Sign In</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="sidebar-brand-logo" style="width: 44px; height: 44px; font-size: 1.5rem;">
          <i class="bi bi-shop"></i>
        </div>
        <span class="fs-3 fw-bold text-dark tracking-tight">ShopSense</span>
      </div>

      <div class="text-center mb-4">
        <h4 class="fw-bold text-dark mb-1">Welcome Back!</h4>
        <p class="text-muted small">Sign in to access your retail inventory dashboard</p>
      </div>

      <form id="login-form">
        <div class="mb-3">
          <label for="login-email" class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" id="login-email" placeholder="alex.morgan@shopsense.io" value="alex.morgan@shopsense.io" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="login-password" class="form-label fw-semibold mb-0">Password</label>
            <a href="/pages/forgot-password.html" class="text-primary text-decoration-none small">Forgot Password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0" id="login-password" placeholder="••••••••" value="password123" required>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="remember-me" checked>
          <label class="form-check-label text-muted small" for="remember-me">
            Remember me on this browser
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 mb-3 fw-semibold fs-6">
          Sign In to Dashboard
        </button>

        <div class="text-center text-muted small">
          Don't have an account? <a href="/pages/signup.html" class="text-primary fw-semibold text-decoration-none">Create Account</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
