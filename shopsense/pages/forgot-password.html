<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | Forgot Password</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="sidebar-brand-logo" style="width: 44px; height: 44px; font-size: 1.5rem;">
          <i class="bi bi-shop"></i>
        </div>
        <span class="fs-3 fw-bold text-dark tracking-tight">ShopSense</span>
      </div>

      <div class="text-center mb-4">
        <h4 class="fw-bold text-dark mb-1">Forgot Password?</h4>
        <p class="text-muted small">Enter your email and we'll send reset instructions</p>
      </div>

      <form id="forgot-form">
        <div class="mb-4">
          <label for="forgot-email" class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" id="forgot-email" placeholder="alex.morgan@shopsense.io" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 mb-3 fw-semibold fs-6">
          Send Reset Link
        </button>

        <div class="text-center text-muted small">
          <a href="/pages/login.html" class="text-secondary fw-medium text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
