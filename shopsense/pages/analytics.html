<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | Sales & Clustering Analytics</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-area">
        <div class="page-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
          <div>
            <h1 class="page-title">Inventory Clustering & Intelligence</h1>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/index.html">ShopSense</a></li>
                <li class="breadcrumb-item active" aria-current="page">Analytics</li>
              </ol>
            </nav>
          </div>
          <div class="d-flex align-items-center gap-2">
            <label for="analytics-timeframe-filter" class="form-label text-nowrap me-2 mb-0 fw-semibold text-muted">Period:</label>
            <select class="form-select border-secondary-subtle" id="analytics-timeframe-filter" aria-label="Select Timeframe">
              <option value="Month">This Month</option>
              <option value="Last Month">Last Month</option>
              <option value="3 Months">Last 3 Months</option>
              <option value="Year">This Year</option>
            </select>
          </div>
        </div>

        <!-- Cluster Summary Cards -->
        <div class="row g-3 mb-4" id="cluster-summary-cards">
          <!-- Rendered dynamically from analytics.js -->
        </div>

        <!-- Main Clustering Scatter Plot Chart Card -->
        <div class="card p-3 p-md-4 mb-4">
          <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mb-3">
            <div>
              <h5 class="fw-bold mb-0 text-dark">Product Velocity vs Margin Clustering</h5>
              <p class="text-muted small mb-0">Scatter plot segmentation: Fast Moving (Blue), Seasonal (Purple), Slow Moving (Amber)</p>
            </div>
            <div class="d-flex align-items-center gap-3 small">
              <span class="d-flex align-items-center gap-1"><span class="p-1 rounded-circle bg-primary"></span> Fast Moving</span>
              <span class="d-flex align-items-center gap-1"><span class="p-1 rounded-circle" style="background-color: #8B5CF6;"></span> Seasonal</span>
              <span class="d-flex align-items-center gap-1"><span class="p-1 rounded-circle bg-warning"></span> Slow Moving</span>
            </div>
          </div>
          <div style="min-height: 380px; position: relative;">
            <canvas id="clusteringScatterChart"></canvas>
          </div>
        </div>

        <!-- Classified Product Cards List -->
        <div>
          <h5 class="fw-bold text-dark mb-3">Segmented Products & Action Plan</h5>
          <div class="row g-3" id="analytics-product-cards">
            <!-- Rendered dynamically from analytics.js -->
          </div>
        </div>

      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/analytics.js"></script>
</body>
</html>
