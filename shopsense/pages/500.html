<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | 500 Server Error</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="text-center" style="max-width: 500px;">
      <div class="display-1 fw-bold text-danger mb-2" style="font-size: 6rem; letter-spacing: -2px;">500</div>
      <div class="p-3 bg-danger-subtle text-danger rounded-circle d-inline-block mb-3">
        <i class="bi bi-gear-wide-connected fs-1"></i>
      </div>
      <h3 class="fw-bold text-dark mb-2">Unexpected Server Issue</h3>
      <p class="text-muted mb-4">Our servers encountered a temporary issue. Please retry or refresh your session.</p>
      <div class="d-flex justify-content-center gap-2">
        <button onclick="window.location.reload();" class="btn btn-outline-secondary px-4 py-2">
          <i class="bi bi-arrow-clockwise me-1"></i> Retry Connection
        </button>
        <a href="/index.html" class="btn btn-primary px-4 py-2 fw-semibold">
          <i class="bi bi-house-door me-1"></i> Return Dashboard
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
