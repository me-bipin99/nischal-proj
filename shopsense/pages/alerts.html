<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | Inventory Alerts</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-area">
        <div class="page-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
          <div>
            <h1 class="page-title">Inventory Alerts & Reorders</h1>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/index.html">ShopSense</a></li>
                <li class="breadcrumb-item active" aria-current="page">Alerts</li>
              </ol>
            </nav>
          </div>
          <div>
            <button class="btn btn-primary" id="reorder-all-btn">
              <i class="bi bi-cart-plus me-1"></i> Reorder All Low Stock Items
            </button>
          </div>
        </div>

        <!-- Summary Metric Cards -->
        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <div class="card p-3 border-start border-4 border-danger">
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <span class="text-muted small fw-medium">Critical Out of Stock Alerts</span>
                  <div class="fs-2 fw-bold text-danger" id="critical-alerts-count">2</div>
                </div>
                <div class="p-3 rounded-circle bg-danger-subtle text-danger">
                  <i class="bi bi-exclamation-octagon-fill fs-3"></i>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6">
            <div class="card p-3 border-start border-4 border-warning">
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <span class="text-muted small fw-medium">Low Stock Warnings</span>
                  <div class="fs-2 fw-bold text-warning" id="warning-alerts-count">3</div>
                </div>
                <div class="p-3 rounded-circle bg-warning-subtle text-warning">
                  <i class="bi bi-exclamation-triangle-fill fs-3"></i>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="card p-3 mb-4">
          <div class="row g-3 align-items-center">
            <div class="col-12 col-sm-6 col-md-4">
              <label for="alert-severity-filter" class="form-label small text-muted mb-1">Filter Severity</label>
              <select class="form-select" id="alert-severity-filter" aria-label="Filter Severity">
                <option value="all">All Severities</option>
                <option value="critical">Critical (Red)</option>
                <option value="warning">Warning (Yellow)</option>
              </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4">
              <label for="alert-status-filter" class="form-label small text-muted mb-1">Filter Status</label>
              <select class="form-select" id="alert-status-filter" aria-label="Filter Status">
                <option value="all">All Statuses</option>
                <option value="unread">Unread</option>
                <option value="read">Read</option>
                <option value="processing">⏳ Processing (Awaiting Supplier)</option>
                <option value="restocked">✅ Restocked</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Alerts List Container -->
        <div id="alerts-container">
          <!-- Rendered dynamically from alerts.js -->
        </div>

      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/alerts.js"></script>
</body>
</html>
