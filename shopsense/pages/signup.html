<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSense | Create Account</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-brand">
        <div class="sidebar-brand-logo" style="width: 44px; height: 44px; font-size: 1.5rem;">
          <i class="bi bi-shop"></i>
        </div>
        <span class="fs-3 fw-bold text-dark tracking-tight">ShopSense</span>
      </div>

      <div class="text-center mb-4">
        <h4 class="fw-bold text-dark mb-1">Start Your Free Trial</h4>
        <p class="text-muted small">Smart Inventory Management for Retail Shops</p>
      </div>

      <form id="signup-form">
        <div class="mb-3">
          <label for="signup-name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="signup-name" placeholder="e.g. Alex Morgan" required>
        </div>

        <div class="mb-3">
          <label for="signup-email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
          <input type="email" class="form-control" id="signup-email" placeholder="alex@retailshop.com" required>
        </div>

        <div class="mb-3">
          <label for="signup-shop" class="form-label fw-semibold">Retail Shop Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="signup-shop" placeholder="e.g. Metro Mart Grocery" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label for="signup-password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="signup-password" placeholder="••••••••" required>
          </div>
          <div class="col-6">
            <label for="signup-confirm-password" class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="signup-confirm-password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terms-agree" required checked>
          <label class="form-check-label text-muted small" for="terms-agree">
            I agree to the <a href="#" class="text-primary text-decoration-none">Terms of Service</a> & <a href="#" class="text-primary text-decoration-none">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 mb-3 fw-semibold fs-6">
          Create Free Account
        </button>

        <div class="text-center text-muted small">
          Already have an account? <a href="/pages/login.html" class="text-primary fw-semibold text-decoration-none">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
